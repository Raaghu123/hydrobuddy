<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HydroBuddy Preview</title>
<style>
body{font-family:system-ui,sans-serif;background:#F0F9FF;margin:0;display:flex;justify-content:center}
.phone{width:380px;min-height:780px;background:#F0F9FF;margin:20px;border-radius:36px;border:10px solid #111;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.streak{background:#FFC42E;border-radius:20px;padding:6px 12px;font-weight:800}
.ring{width:220px;height:220px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(#00C2FF 0 65%,#fff 65% 100%);position:relative}
.ring:after{content:'';position:absolute;inset:18px;background:#F0F9FF;border-radius:50%}
.inner{position:relative;z-index:1;text-align:center}
.inner h1{color:#1B2CC1;margin:0;font-size:30px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px}
.btns button{background:#1B2CC1;color:#fff;border:0;border-radius:16px;padding:12px 16px;font-weight:800}
.card{background:#fff;border-radius:20px;margin:12px 16px;padding:14px}
.nav{display:flex;justify-content:space-around;padding:14px;background:#fff;border-top:1px solid #eee;font-weight:700;color:#1B2CC1}
.bar{display:flex;align-items:end;gap:8px;height:110px;margin-top:10px}
.bar div{flex:1;background:#00C2FF;border-radius:8px;text-align:center;font-size:10px;color:#fff}
</style></head><body>
<div class="phone">
<div class="header"><b>💧 HydroBuddy</b><span class="streak">🔥 4</span></div>
<div class="ring"><div class="inner"><div style="font-size:34px">💧</div><h1>1625 ml</h1><small>of 2500 ml goal</small><div><b>65%</b></div></div></div>
<div class="btns"><button>🥤 +150</button><button>💧 +250</button><button>🥛 +350</button><button>🐳 +500</button></div>
<div class="card">🏅 <b>3 / 6 achievements</b><br><small>first_sip • half_way • big_chug</small></div>
<div class="card"><b>📊 Last 7 days</b><div class="bar">
<div style="height:40%">M</div><div style="height:70%">T</div><div style="height:55%">W</div><div style="height:90%;background:#4ADE80">T</div><div style="height:65%">F</div><div style="height:30%">S</div><div style="height:65%">S</div>
</div></div>
<div class="card">⌚ <b>Wear OS + Widget ready</b><br><small>Tile mirrors 65% • Widget shows ring</small></div>
<div class="nav"><span>💧 Drink</span><span>📊 Stats</span><span>⚙️ Settings</span></div>
</div></body></html>
