name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter doctor -v
        working-directory: .

      # Generate fresh Android v2-embedding scaffold, then inject permissions + desugaring.
      - run: |
          flutter create . --project-name hydration_reminder --org com.hydrobuddy.app --platforms android
          python3 - <<'PY'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
          '''
          if 'POST_NOTIFICATIONS' not in t:
              t = t.replace('<application', perms + '<application', 1)
              m.write_text(t)
              print('permissions injected')
          else:
              print('permissions already present')

          # flutter_local_notifications requires core library desugaring.
          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              if 'desugar_jdk_libs' in s:
                  print(name, 'already has desugaring')
                  continue
              if name.endswith('.kts'):
                  s = s.replace('sourceCompatibility = JavaVersion.VERSION_17',
                                'sourceCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true')
                  # add dep before final closing brace of dependencies block
                  s = s.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
              else:
                  s = s.replace('sourceCompatibility = JavaVersion.VERSION_17',
                                'sourceCompatibility = JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true')
                  s = s.replace('dependencies {', "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", 1)
              p.write_text(s)
              print('desugaring patched:', name)
          PY
          flutter pub get
        working-directory: .

      - run: flutter analyze || true
        working-directory: .

      - run: flutter build apk --debug
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: hydrobuddy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
