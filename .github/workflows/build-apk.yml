name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter doctor -v
        working-directory: .

      # Generate fresh Android v2-embedding scaffold, then inject permissions + desugaring.
      - run: |
          flutter create . --project-name hydration_reminder --org com.hydrobuddy.app --platforms android
          python3 - <<'PY'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
          '''
          if 'POST_NOTIFICATIONS' not in t:
              t = t.replace('<application', perms + '<application', 1)
              m.write_text(t)
              print('permissions injected')
          else:
              print('permissions already present')

          # flutter_local_notifications requires core library desugaring.
          python3 - <<'PY'
          import pathlib, re
          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              print('---', name, '---')
              print(s[:2000])
              if 'desugar_jdk_libs' not in s:
                  if name.endswith('.kts'):
                      # ensure flag
                      if 'isCoreLibraryDesugaringEnabled' not in s:
                          s, n = re.subn(r'(sourceCompatibility\s*=\s*JavaVersion\.VERSION_\S+)',
                                         r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
                          print('flag added:', n)
                      # inject dep into dependencies block (robust to formatting)
                      s, n = re.subn(r'(dependencies\s*\{)',
                                     r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                                     s, count=1)
                      print('dep added:', n)
                  else:
                      if 'coreLibraryDesugaringEnabled' not in s:
                          s, n = re.subn(r'(sourceCompatibility\s+JavaVersion\.VERSION_\S+)',
                                         r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
                          print('flag added:', n)
                      s, n = re.subn(r'(dependencies\s*\{)',
                                     r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                                     s, count=1)
                      print('dep added:', n)
                  p.write_text(s)
              else:
                  print(name, 'already has desugaring')
          PY
          flutter pub get
        working-directory: .

      - run: flutter analyze || true
        working-directory: .

      - run: flutter build apk --debug
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: hydrobuddy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
