name: hydration_reminder
description: Playful gamified hydration reminder with smart reminders, tracking, stats & Wear OS support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  fl_chart: ^0.66.0
  confetti: ^0.7.0
  intl: ^0.19.0
  flutter_tts: ^4.0.2
  vibration: ^2.0.0
  audioplayers: ^6.0.0
  record: ^6.1.0
  path_provider: ^2.1.2
  permission_handler: ^12.0.0
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
